# ---------------------------------------------------------------------------
# Lifecycle and state-machine authorities (duplicate authority = gate violation)
# ---------------------------------------------------------------------------
lifecycle_authorities:
  project:              control.registry.project
  candidate:            engineering.candidate
  candidate_promotion:  lifecycle.release
  stable_rollback:      lifecycle.recovery
  job:                  execution.durable
  workflow_execution:   execution.workflow
  provider_health:      control.registry.provider
  plugin:               engineering.plugin
  release:              lifecycle.release
  core_upgrade:         lifecycle.evolution
  backup_restore:       lifecycle.recovery
  evolution_campaign:   lifecycle.evolution
  hardening_round:      acceptance.engine
  import_project:       engineering.import

state_machine_authorities:
  Project:             control.registry.project
  Candidate:           engineering.candidate
  Job:                 execution.durable
  WorkflowExecution:   execution.workflow
  ProviderHealth:      control.registry.provider
  PluginLifecycle:     engineering.plugin
  Release:             lifecycle.release
  CoreUpgrade:         lifecycle.evolution
  BackupRestore:       lifecycle.recovery
  EvolutionCampaign:   lifecycle.evolution
  HardeningRound:      acceptance.engine
  ImportProject:       engineering.import

# ---------------------------------------------------------------------------
# Provider/model authority references. Copying any of these fields elsewhere
# is a shadow-registry violation.
# ---------------------------------------------------------------------------
provider_authority:
  owner: control.registry.provider
  fields_owned: [identity, model_identity, configuration, health, availability, cost_metadata, fallback]
  reference_only_consumers:
    - control.capability
    - execution.scheduler
    - engineering.agent
    - engineering.localai
    - surfaces.operations
  copying_permitted: false
  caching_permitted: false

# ---------------------------------------------------------------------------
# Isolation / security ownership
# ---------------------------------------------------------------------------
isolation:
  owner: control.isolation
  enforcement_point: execution.sandbox
  properties: [FS_CONFINEMENT, NET_EGRESS_CONTROL, PROCESS_CONTAINMENT,
               CREDENTIAL_ISOLATION, RESOURCE_LIMITS, KERNEL_ISOLATION, DISPOSABILITY]
  tier_requirements:
    TRUST-0: []
    TRUST-1: [FS_CONFINEMENT, PROCESS_CONTAINMENT, RESOURCE_LIMITS]
    TRUST-2: [FS_CONFINEMENT, PROCESS_CONTAINMENT, RESOURCE_LIMITS, NET_EGRESS_CONTROL, CREDENTIAL_ISOLATION]
    TRUST-3: [FS_CONFINEMENT, PROCESS_CONTAINMENT, RESOURCE_LIMITS, NET_EGRESS_CONTROL, CREDENTIAL_ISOLATION, KERNEL_ISOLATION]
    TRUST-4: [FS_CONFINEMENT, PROCESS_CONTAINMENT, RESOURCE_LIMITS, NET_EGRESS_CONTROL, CREDENTIAL_ISOLATION, KERNEL_ISOLATION, DISPOSABILITY]
  backends:
    job_object:        [PROCESS_CONTAINMENT, RESOURCE_LIMITS]
    restricted_token:  [FS_CONFINEMENT]
    workspace_acl:     [FS_CONFINEMENT]
    wfp_egress:        [NET_EGRESS_CONTROL]
    vault_detach:      [CREDENTIAL_ISOLATION]
    windows_sandbox:   [FS_CONFINEMENT, PROCESS_CONTAINMENT, RESOURCE_LIMITS, NET_EGRESS_CONTROL, CREDENTIAL_ISOLATION, KERNEL_ISOLATION, DISPOSABILITY]
    hyperv_container:  [FS_CONFINEMENT, PROCESS_CONTAINMENT, RESOURCE_LIMITS, NET_EGRESS_CONTROL, CREDENTIAL_ISOLATION, KERNEL_ISOLATION]
  composition_permitted: true
  on_unsatisfiable: DENY
  capability_state_when_unsatisfiable: UNSUPPORTED
  silent_downgrade_permitted: false
  registry_is_protected_core: true
  backend_change_gate: HUMAN_GATE_4

# ---------------------------------------------------------------------------
# Computer-Use operation classes (also the plugin permission vocabulary)
# ---------------------------------------------------------------------------
operation_classes:
  READ_FILE:                   {default: AUTO,      fixed: null}
  WRITE_WORKSPACE_FILE:        {default: AUTO,      fixed: null}
  WRITE_STABLE_FILE:           {default: DENY,      fixed: DENY}
  ROLLBACK_STABLE:             {default: DENY,      fixed: RECOVERY_SUPERVISOR_ONLY}
  RUN_PROCESS:                 {default: AUTO,      fixed: null}
  TERMINATE_PROCESS:           {default: AUTO,      fixed: OWN_PROCESS_ONLY}
  BROWSER_LOCAL:               {default: AUTO,      fixed: LOOPBACK_ONLY}
  BROWSER_EXTERNAL:            {default: ASK_USER,  fixed: DENY_IN_LOCAL_ONLY}
  NETWORK_EXTERNAL:            {default: ASK_USER,  fixed: DENY_IN_LOCAL_ONLY}
  INSTALL_DEPENDENCY:          {default: AUTO,      fixed: LOCKFILE_BOUND}
  INSTALL_SYSTEM_SOFTWARE:     {default: ASK_USER,  fixed: NEVER_AUTO}
  CHANGE_SYSTEM_CONFIGURATION: {default: ASK_USER,  fixed: NEVER_AUTO}
  ACCESS_SECRET:               {default: DENY,      fixed: NEVER_AUTO_OUTSIDE_PREAUTHORIZED_SCOPE}
  APPLY_MIGRATION:             {default: ASK_USER,  fixed: HUMAN_GATE_6_ON_REAL_OR_STABLE_DATA}
unmapped_action_resolution: DENY

# ---------------------------------------------------------------------------
# Stable mutation policy
# ---------------------------------------------------------------------------
stable_mutation:
  direct_mutation_permitted_by: []          # empty by design
  prohibited_actors: [ai_agent, deterministic_transformer, workflow, plugin,
                      computer_use_worker, human_operated_engineering_tool]
  required_path: [stable, candidate, verification, acceptance, promotion]
  sole_exception:
    operation: ROLLBACK_STABLE
    invoker: lifecycle.recovery
    target_must_be: previously_verified_immutable_revision
    mechanism_preference: atomic_revision_pointer_switch
    novel_content_permitted: false
    transformation_during_restore_permitted: false
    evidence_required: true
    direct_ai_invocation_permitted: false
  effective_from: "first revision designated Stable by lifecycle.release"

# ---------------------------------------------------------------------------
# Architecture verification gates (all must evaluate 0)
# ---------------------------------------------------------------------------
architecture_gates:
  - {id: duplicate_canonical_authority,   threshold: 0, negative_control_fixture_required: true}
  - {id: shadow_registry,                 threshold: 0, negative_control_fixture_required: true}
  - {id: duplicate_state_machine_authority, threshold: 0, negative_control_fixture_required: true}
  - {id: duplicate_lifecycle_authority,   threshold: 0, negative_control_fixture_required: true}
  - {id: forbidden_dependency_direction,  threshold: 0, negative_control_fixture_required: true}
  - {id: forbidden_cycles,                threshold: 0, negative_control_fixture_required: true}
  - {id: protected_core_boundary_violation, threshold: 0, negative_control_fixture_required: true}
  - {id: architecture_budget_violation,   threshold: 0, exception_gate: HUMAN_GATE_8, negative_control_fixture_required: true}
identifier_only_checker_is_sufficient: false
