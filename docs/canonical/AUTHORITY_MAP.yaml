  control.policy:        {layer: control,     protected_core: true,  module_root: backend/arkali/control/policy}
  control.isolation:     {layer: control,     protected_core: true,  module_root: backend/arkali/control/isolation}
  control.registry.provider: {layer: control, protected_core: false, module_root: backend/arkali/control/registry/provider}
  control.registry.project:  {layer: control, protected_core: false, module_root: backend/arkali/control/registry/project}
