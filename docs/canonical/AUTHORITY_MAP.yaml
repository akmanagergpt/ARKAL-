# ARKALI GENESIS v2 — CANONICAL AUTHORITY MAP
# Status: PHASE 0 CANDIDATE — AWAITING HUMAN GATE 1
# Machine-readable input for the architecture verification gates defined in
# ARKALI_GENESIS_V2_VERIFICATION_AND_DELIVERY_CONTRACT.md (Architecture verification).
# Derived from canonical set at 079c925996034017855fb9d1f1fa532077d7e86d

schema_version: 1
canonical_source_commit: "079c925996034017855fb9d1f1fa532077d7e86d"
status: "PHASE_0_CANDIDATE_AWAITING_HUMAN_GATE_1"

# ---------------------------------------------------------------------------
# Layer model. A context may depend only on strictly lower layers.
# ---------------------------------------------------------------------------
layers:
  - {rank: 0, name: kernel}
  - {rank: 1, name: control}
  - {rank: 2, name: evidence}
  - {rank: 3, name: execution}
  - {rank: 4, name: engineering}
  - {rank: 5, name: lifecycle}
  - {rank: 6, name: surfaces}

dependency_rules:
  allow_lower_layer: true
  allow_same_layer: false          # except allowed_sibling_edges below
  allow_higher_layer: false        # no exception
  allow_cycles: false
  evidence_write_from_any_layer: true
  evidence_read_for_verdict_only_by: acceptance.engine
  policy_callable_from_any_layer: true

allowed_sibling_edges:
  - {from: execution.sandbox, to: execution.durable, reason: "job lifecycle binding"}
  - {from: execution.workflow, to: execution.durable, reason: "workflow steps are durable jobs"}
  - {from: engineering.factory, to: engineering.candidate, reason: "factory assembles candidates"}
  - {from: engineering.factory, to: engineering.agent, reason: "factory dispatches agent tasks"}
  - {from: engineering.repair, to: engineering.candidate, reason: "repairs produce candidates"}
  - {from: lifecycle.evolution, to: lifecycle.release, reason: "promotion handoff"}
  - {from: lifecycle.recovery, to: lifecycle.release, reason: "reads stable revision pointer"}
  - {from: control.specification, to: control.architecture, reason: "D-025: requirement/architecture intelligence composes the live authority map's concerns rather than duplicating them"}
  - {from: engineering.factory, to: engineering.repair, reason: "D-026 / ARK-REQ-0393: failover reuses the existing C-26 anti-loop/budget mechanism rather than a second one"}

# ---------------------------------------------------------------------------
# Architecture budgets. Numeric. Exception = HUMAN GATE 8 + ADR.
# ---------------------------------------------------------------------------
architecture_budgets:
  max_module_logical_lines: 400
  max_public_symbols_per_module: 20
  max_fan_in_per_module: 15
  max_fan_out_per_module: 12
  max_public_surface_per_context: 40
  max_orchestration_depth: 4
  max_cyclomatic_complexity_per_function: 12
  max_parameters_per_public_function: 6
  max_contexts_touched_by_module: 3
  exception_gate: HUMAN_GATE_8
  exception_requires_adr: true
  exception_may_be_authored_by_implementing_actor: false

# ---------------------------------------------------------------------------
# Architecture budget MEASUREMENT contract (ERR-003, closes F-0020).
#
# A budget that participates in acceptance must have exactly one deterministic
# measurement definition. Numbers without a formula were unenforceable, and any
# formula chosen by an implementing actor would decide whether its own code
# complies - which ADR-0008 forbids for the exception, and therefore equally for
# the rule that decides an exception is needed.
#
# This is data, not code. The gate reads it; no validator holds a private copy.
# Changing a value here changes the verdict without editing any validator.
# `contract_version` is recorded in every measurement result so a change to the
# formula is auditable and cannot be mistaken for a change in the code measured.
#
# Owner: control.architecture. This is NOT a second budget authority - it is the
# measurement half of the existing `architecture_budgets` declaration above.
# ---------------------------------------------------------------------------
architecture_budget_measurement:
  contract_version: "1.0.0"
  ratified_by: "human ruling, erratum ERR-003"

  cyclomatic_complexity:
    # Standard McCabe: M = decision_points + 1, per function or method,
    # computed from the Python AST. Nested functions are measured
    # independently and do not contribute to their enclosing function.
    method: mccabe_decision_points
    subject: python_function_or_method
    base: 1
    nested_functions_measured_independently: true
    # Each AST node type below contributes the stated amount when it occurs in
    # the function body. `elif` is an ast.If in the orelse branch and is counted
    # by the If rule; a plain `else` adds nothing, since it is the fall-through
    # of a decision already counted.
    increment_per_node:
      If: 1
      IfExp: 1
      For: 1
      AsyncFor: 1
      While: 1
      ExceptHandler: 1
      Assert: 1
      comprehension: 1
      comprehension_if: 1
      match_case: 1
    # `a and b and c` has two decision points, not three: values - 1.
    increment_per_boolean_value_beyond_first:
      BoolOp: 1
    not_counted:
      - With
      - AsyncWith
      - Try
      - Return
      - Raise
      - Lambda
      - FunctionDef
      - AsyncFunctionDef
      - ClassDef

  orchestration_depth:
    # ARCHITECTURE.md section 8 defines this budget as "call chain across
    # contexts". The subject is therefore the bounded context, not the module:
    # ordinary depth inside one context is not orchestration depth. Edges are
    # derived from real Python imports resolved to owning contexts, never from
    # a hand-maintained component list.
    method: longest_directed_chain_over_context_graph
    subject: bounded_context
    edge_evidence: resolved_python_imports
    canonical_definition_source: "ARCHITECTURE.md section 8"
    depth_counts: contexts_in_chain
    on_cycle: FAIL
    on_unresolvable_context_ownership: FAIL
    self_edges_ignored: true

# ---------------------------------------------------------------------------
# Human gates
# ---------------------------------------------------------------------------
human_gates:
  HUMAN_GATE_1: "PHASE 0 canonical architecture acceptance (0A + 0B as one package)"
  HUMAN_GATE_2: "ARKALI Stable Core promotion"
  HUMAN_GATE_3: "Generated-product promotion where approval-gated"
  HUMAN_GATE_4: "Weakening or change of a security boundary, sandbox tier or protected-core policy"
  HUMAN_GATE_5: "Exceptional applicability waiver"
  HUMAN_GATE_6: "APPLY of a migration to real or stable data"
  HUMAN_GATE_7: "Final Production Release"
  HUMAN_GATE_8: "Exception to a canonical architecture budget"

machine_autonomy:
  normal_phase_acceptance: machine
  normal_phase_requires_human_approval: false
  failed_machine_gate_blocks_progression: true
  failed_gate_may_be_rescored_by_implementing_actor: false

# ---------------------------------------------------------------------------
# Concerns -> exactly one canonical owning component.
# Any duplicate `owner` for one `concern` is a gate violation.
# ---------------------------------------------------------------------------
concerns:
