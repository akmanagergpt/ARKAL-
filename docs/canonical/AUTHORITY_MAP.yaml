  - {concern: requirement_and_architecture_intelligence, owner: control.specification}
  - {concern: architecture_rules_and_budgets,          owner: control.architecture}
  - {concern: protected_core_membership,               owner: control.architecture, enforced_by: control.policy}
  - {concern: policy_decision,                         owner: control.policy}
  - {concern: secret_storage_and_brokering,            owner: control.policy}
  - {concern: isolation_backend_availability,          owner: control.isolation}
  - {concern: provider_identity,                       owner: control.registry.provider}
  - {concern: model_identity,                          owner: control.registry.provider}
  - {concern: provider_configuration,                  owner: control.registry.provider}
  - {concern: provider_health,                         owner: control.registry.provider}
  - {concern: provider_availability,                   owner: control.registry.provider}
  - {concern: provider_cost_metadata,                  owner: control.registry.provider}
  - {concern: provider_fallback_configuration,         owner: control.registry.provider}
  - {concern: project_and_revision_identity,           owner: control.registry.project}
  - {concern: capability_availability_answer,          owner: control.capability}
  - {concern: artifact_identity_and_provenance,        owner: evidence.artifact}
  - {concern: audit_chain_and_evidence_integrity,      owner: evidence.audit}
  - {concern: acceptance_verdict,                      owner: acceptance.engine}
  - {concern: phase_gating_before_phase_13,            owner: acceptance.engine}
  - {concern: durable_job_state,                       owner: execution.durable}
  - {concern: canonical_workflow_graph,                owner: execution.workflow}
  - {concern: resource_allocation,                     owner: execution.scheduler}
  - {concern: sandbox_execution,                       owner: execution.sandbox}
  - {concern: agent_task_bounding_and_context,         owner: engineering.agent}
  - {concern: code_graphs_and_digital_twin,            owner: engineering.codeintel}
