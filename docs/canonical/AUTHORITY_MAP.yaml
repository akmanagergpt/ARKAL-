  - {concern: knowledge_validity_state,                owner: engineering.knowledge}
  - {concern: imported_project_lifecycle,              owner: engineering.import}
  - {concern: plugin_lifecycle,                        owner: engineering.plugin}
  - {concern: local_model_adapters,                    owner: engineering.localai}
  - {concern: stable_promotion,                        owner: lifecycle.release}
  - {concern: stable_rollback,                         owner: lifecycle.recovery}
