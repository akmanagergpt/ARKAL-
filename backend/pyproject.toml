[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkali"
version = "0.1.0"
description = "ARKALI GENESIS v2 — Engineering Control Fabric (Phase 1 bootstrap)"
readme = "../README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# Canonical frozen technology direction (MASTER_SPECIFICATION §Frozen technology
# direction). Versions are declared here in Phase 1; nothing is installed and no
# runtime capability is implemented until Phase 2 and later.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arkali*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "structural: repository/architecture structure tests (Phase 1)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
namespace_packages = true
