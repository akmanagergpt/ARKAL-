; C-03 Alembic configuration. Owner: kernel.persistence.
;
; The database URL is deliberately NOT written here. `alembic/env.py` obtains it
; from the caller or from ARKALI_DATABASE_URL, so no environment's database
; location is baked into a tracked file and no runtime database can be committed
; by accident (ARCHITECTURE.md section 10).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
